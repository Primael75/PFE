[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "agritech"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "fastmcp>=4.1.3,<5",
    "mcp>=2.3.0,<3",
    "uvicorn",
    "fastapi",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff.lint]
extend-select = ["T20"]

