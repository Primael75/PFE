[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "agritech"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "fastmcp>=4.1.3,<5",
    "mcp>=2.3.0,<3",
    "uvicorn",
    "fastapi",
    "httpx2>=2.16,<3",
]

[dependency-groups]
dev = ["ruff", "pytest"]
diagnosis = [
    "numpy>=2.5,<3",
    "pillow>=13,<14",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]

[tool.ruff.lint]
extend-select = ["T20"]

