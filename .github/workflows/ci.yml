name: CI

on:
  pull_request:
    branches: [main, pre-integration]
  push:
    branches: [main, pre-integration]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer uv et Python 3.12
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Installer le projet et ses outils
        run: uv sync --locked --group diagnosis --group rainfall

      - name: Contrôles (style, mise en forme, tests)
        run: make check
