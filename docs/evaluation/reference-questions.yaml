  model_output: {value: uncertain, uncertainty: 0.41}
  reference_answer: >-
    The model is not confident enough to suggest a diagnosis. The agent gives
    no disease sheet; it advises taking a sharp photo of an affected leaf, or
    showing the plant to a technician.
