# Reference questions, format v0.2: see README.md in this directory.

- id: DIAG-001
  agent: diagnosis
  type: knowledge
  question: How does cassava mosaic spread from one field to another?
  model_output: null
  reference_answer: >-
    Cassava mosaic spreads mainly through cuttings taken from diseased plants
    and planted again. It also spreads through the whitefly (Bemisia tabaci),
    which carries the virus from a diseased plant to a healthy one as it feeds.
  required_points:
    - infected cuttings used as planting material
    - whitefly (Bemisia tabaci) as the vector
  forbidden:
    - a chemical treatment that would cure the plant
  expected_figures: []
  expected_sources: [cassava_mosaic]
  expected_tools: [document_search]
  refusal_expected: false
  technician_referral: false
  requirements: [EF-18, EF-04]
  fact_sources:
    - https://scripts.farmradio.fm/radio-script/backgrounder-cassava-mosaic-disease/
  author: Kelyan
  date: "2026-11-23"
  version: "0.2"

- id: DIAG-002
  agent: diagnosis
  type: photo
  question: Here is a photo of my cassava. What is wrong with it?
  model_output: {value: cassava_mosaic, uncertainty: 0.91}
  reference_answer: >-
    The photo suggests African cassava mosaic, a disease caused by a virus and
    spread by the whitefly. The diagnosis must be confirmed by a technician.
    The answer presents the disease sheet with its source.
  required_points:
    - "name shown: African cassava mosaic"
    - says the diagnosis must be confirmed by a technician
    - cites the source sheet
  forbidden:
    - diagnosis presented as certain
    - unsourced product dose
  expected_figures: []
  expected_sources: [cassava_mosaic]
  expected_tools: [diagnose_photo, document_search]
  refusal_expected: false
  technician_referral: true
  requirements: [EF-15, EF-18]
  fact_sources:
    - https://ckan.madiphs.org/plant-health-knowledge-product/cassava-mosaic-disease
  author: Kelyan
  date: "2026-11-23"
  version: "0.2"

