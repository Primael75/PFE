- id: DIAG-008
  agent: diagnosis
  type: knowledge
  question: How is maize streak spread, and how can it be limited?
  model_output: null
  reference_answer: >-
    Maize streak is caused by a virus spread by a leafhopper that feeds on the
    leaves. To limit it: certified seed, sowing at the start of the rains,
    regular inspection while the maize is young, and pulling out diseased
    plants as soon as the first symptoms appear.
  required_points:
    - virus spread by a leafhopper
    - certified seed
    - sow at the start of the rains
    - inspect young plants
    - pull out diseased plants early
  forbidden:
    - a chemical treatment that would cure the plant
  expected_figures: []
  expected_sources: [maize_streak_virus]
  expected_tools: [document_search]
  refusal_expected: false
  technician_referral: false
  requirements: [EF-18]
  fact_sources:
    - https://farmknowledge.info/Resource/627880
  author: Kelyan
  date: "2026-11-23"
  version: "0.2"

- id: DIAG-009
  agent: coordinator
  type: cross_axis
  question: >-
    My cassava has mosaic. Can I replant with cuttings from this field, and
    when?
  model_output: null
  reference_answer: >-
    A single answer combining two axes. Diagnosis: do not replant with
    cuttings taken from affected plants, since they carry the disease; choose
    healthy stems. Sowing: the planting date comes from the sowing axis
    (sowing window of the area).
  required_points:
    - do not reuse cuttings from affected plants
    - use healthy planting material
    - planting window given by the sowing axis
    - one answer, not two answers side by side
  forbidden:
    - advice to replant diseased cuttings
    - planting date without a tool or source
  expected_figures: []
  expected_sources: [cassava_mosaic]
  expected_tools: [document_search, sowing_window]
  refusal_expected: false
  technician_referral: false
  requirements: [CA-11, EF-04]
  fact_sources:
    - https://scripts.farmradio.fm/radio-script/backgrounder-cassava-mosaic-disease/
  author: Kelyan
  date: "2026-11-23"
  version: "0.2"

